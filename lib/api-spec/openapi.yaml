openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: NeonSportz API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: leagues
    description: League operations
  - name: teams
    description: Team operations
  - name: players
    description: Player operations
  - name: games
    description: Game operations

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /leagues:
    get:
      operationId: listLeagues
      tags: [leagues]
      summary: List leagues
      parameters:
        - name: platform
          in: query
          schema:
            type: string
        - name: difficulty
          in: query
          schema:
            type: string
        - name: category
          in: query
          schema:
            type: string
        - name: skill_level
          in: query
          schema:
            type: string
        - name: is_cross_play
          in: query
          schema:
            type: boolean
        - name: is_money_league
          in: query
          schema:
            type: boolean
        - name: search
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of leagues
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/League"
    post:
      operationId: createLeague
      tags: [leagues]
      summary: Create league
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeagueInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/League"

  /leagues/featured:
    get:
      operationId: getFeaturedLeagues
      tags: [leagues]
      summary: Get featured leagues
      responses:
        "200":
          description: Featured leagues
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/League"

  /leagues/{id}:
    get:
      operationId: getLeague
      tags: [leagues]
      summary: Get league
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: League
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/League"
        "404":
          description: Not found
    patch:
      operationId: updateLeague
      tags: [leagues]
      summary: Update league
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeagueUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/League"
    delete:
      operationId: deleteLeague
      tags: [leagues]
      summary: Delete league
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /leagues/{id}/summary:
    get:
      operationId: getLeagueSummary
      tags: [leagues]
      summary: Get league dashboard summary
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: League summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeagueSummary"

  /leagues/{id}/standings:
    get:
      operationId: getLeagueStandings
      tags: [leagues]
      summary: Get league standings
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Standings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StandingEntry"

  /leagues/{id}/stats/leaders:
    get:
      operationId: getLeagueStatLeaders
      tags: [leagues]
      summary: Get statistical leaders
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Stat leaders
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatLeaders"

  /leagues/{id}/game-of-week:
    get:
      operationId: getLeagueGameOfWeek
      tags: [leagues]
      summary: Get current Game of the Week for a league
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Game of the Week or null
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/GameOfWeek"
                  - type: "null"
    post:
      operationId: createLeagueGameOfWeek
      tags: [leagues]
      summary: Create or replace the Game of the Week
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GameOfWeekInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameOfWeek"
    delete:
      operationId: deleteLeagueGameOfWeek
      tags: [leagues]
      summary: Delete the current Game of the Week
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /leagues/{id}/stats/players:
    get:
      operationId: getLeaguePlayerStats
      tags: [leagues]
      summary: Get aggregated season stats for all players in a league
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Aggregated player season stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeaguePlayerStats"

  /leagues/{id}/stats/seasons:
    get:
      operationId: getLeagueStatsMeta
      tags: [leagues]
      summary: Get available seasons and weeks for a league
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Available seasons and weeks
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeagueStatsMeta"

  /leagues/{id}/teams:
    get:
      operationId: getLeagueTeams
      tags: [leagues]
      summary: List teams in league
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Teams
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Team"
    post:
      operationId: addLeagueTeam
      tags: [leagues]
      summary: Add team to league
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeamInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Team"

  /leagues/{id}/members:
    get:
      operationId: getLeagueMembers
      tags: [leagues]
      summary: List members in league
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Member"
    post:
      operationId: addLeagueMember
      tags: [leagues]
      summary: Add member to league
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"

  /leagues/{id}/members/{memberId}:
    patch:
      operationId: updateLeagueMember
      tags: [leagues]
      summary: Update league member
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: memberId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
    delete:
      operationId: deleteLeagueMember
      tags: [leagues]
      summary: Remove member from league
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: memberId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /leagues/{id}/join-requests:
    get:
      operationId: getLeagueJoinRequests
      tags: [leagues]
      summary: List join requests for a league
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Join requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/JoinRequest"
    post:
      operationId: createLeagueJoinRequest
      tags: [leagues]
      summary: Submit a join request
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JoinRequestInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JoinRequest"

  /leagues/{id}/join-requests/{requestId}:
    patch:
      operationId: updateLeagueJoinRequest
      tags: [leagues]
      summary: Approve, deny, or update a join request
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: requestId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JoinRequestUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JoinRequest"
    delete:
      operationId: deleteLeagueJoinRequest
      tags: [leagues]
      summary: Delete a join request
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: requestId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /leagues/{id}/trades:
    get:
      operationId: getLeagueTrades
      tags: [leagues]
      summary: List trades in a league
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Trades list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LeagueTrade"
    post:
      operationId: createLeagueTrade
      tags: [leagues]
      summary: Create a trade proposal
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLeagueTradeInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeagueTrade"

  /leagues/{id}/trades/{tradeId}:
    patch:
      operationId: updateLeagueTrade
      tags: [leagues]
      summary: Update trade status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: tradeId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateLeagueTradeInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeagueTrade"
    delete:
      operationId: deleteLeagueTrade
      tags: [leagues]
      summary: Delete a trade
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: tradeId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /leagues/{id}/trades/counts:
    get:
      operationId: getLeagueTradeCounts
      tags: [leagues]
      summary: Per-team trade counts for a league
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Trade counts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LeagueTradeCount"

  /leagues/{id}/transactions:
    get:
      operationId: getLeagueTransactions
      tags: [leagues]
      summary: List player transactions in a league
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Transactions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LeagueTransaction"

  /leagues/{id}/draft:
    get:
      operationId: getLeagueDraft
      tags: [leagues]
      summary: List draft picks for a league
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Draft picks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LeagueDraftEntry"

  /leagues/{id}/games:
    get:
      operationId: getLeagueGames
      tags: [leagues]
      summary: List games in league
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Games
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Game"
    post:
      operationId: createGame
      tags: [games]
      summary: Create game
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GameInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Game"

  /teams/{id}:
    get:
      operationId: getTeam
      tags: [teams]
      summary: Get team
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Team
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Team"
    patch:
      operationId: updateTeam
      tags: [teams]
      summary: Update team
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeamUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Team"

  /teams/{id}/players:
    get:
      operationId: getTeamPlayers
      tags: [teams]
      summary: Get players on team
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Players
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Player"
    post:
      operationId: addPlayer
      tags: [teams]
      summary: Add player to team
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlayerInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Player"

  /teams/{id}/games:
    get:
      operationId: getTeamGames
      tags: [teams]
      summary: Get all games for a team
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Games
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TeamGame"

  /players/{id}:
    get:
      operationId: getPlayer
      tags: [players]
      summary: Get player
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Player
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayerDetail"
    patch:
      operationId: updatePlayer
      tags: [players]
      summary: Update player
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlayerUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Player"

  /players/{id}/gamelog:
    get:
      operationId: getPlayerGameLog
      tags: [players]
      summary: Get game-by-game stat log for a player
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Game log entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GameLogEntry"

  /players/{id}/awards:
    get:
      operationId: getPlayerAwards
      tags: [players]
      summary: Get awards for a player
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Awards list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PlayerAward"
    post:
      operationId: addPlayerAward
      tags: [players]
      summary: Add an award to a player
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlayerAwardInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayerAward"

  /players/{id}/awards/{awardId}:
    delete:
      operationId: deletePlayerAward
      tags: [players]
      summary: Remove an award from a player
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: awardId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /players/{id}/transactions:
    get:
      operationId: getPlayerTransactions
      tags: [players]
      summary: Get transaction history for a player
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Transactions list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PlayerTransaction"
    post:
      operationId: addPlayerTransaction
      tags: [players]
      summary: Add a transaction to a player's history
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlayerTransactionInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayerTransaction"

  /players/{id}/transactions/{transactionId}:
    delete:
      operationId: deletePlayerTransaction
      tags: [players]
      summary: Remove a transaction from a player's history
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: transactionId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /games/{id}:
    get:
      operationId: getGame
      tags: [games]
      summary: Get game detail with player stats
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Game detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameDetail"
    patch:
      operationId: updateGame
      tags: [games]
      summary: Update game score/status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GameUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Game"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    League:
      type: object
      required:
        - id
        - name
        - commissioner_name
        - platform
        - difficulty
        - category
        - skill_level
        - advance_time_hours
        - week
        - season
        - phase
        - member_count
        - max_members
        - is_cross_play
        - is_money_league
        - created_at
      properties:
        id:
          type: integer
        name:
          type: string
        commissioner_name:
          type: string
        platform:
          type: string
          description: "PS5, Xbox, PC"
        difficulty:
          type: string
          description: "ALL_MADDEN, PRO, ROOKIE, VETERAN"
        category:
          type: string
          description: "REGULAR, FANTASY"
        skill_level:
          type: string
          description: "BEGINNER, INTERMEDIATE, ADVANCED"
        advance_time_hours:
          type: integer
        week:
          type: integer
        season:
          type: integer
        phase:
          type: string
          description: "PRE_SEASON, REGULAR_SEASON, POST_SEASON, SUPER_BOWL"
        member_count:
          type: integer
        max_members:
          type: integer
        is_cross_play:
          type: boolean
        is_money_league:
          type: boolean
        description:
          type: ["string", "null"]
        created_at:
          type: string

    LeagueInput:
      type: object
      required:
        - name
        - commissioner_name
        - platform
        - difficulty
        - category
        - skill_level
        - advance_time_hours
        - max_members
      properties:
        name:
          type: string
        commissioner_name:
          type: string
        platform:
          type: string
        difficulty:
          type: string
        category:
          type: string
        skill_level:
          type: string
        advance_time_hours:
          type: integer
        max_members:
          type: integer
        is_cross_play:
          type: boolean
        is_money_league:
